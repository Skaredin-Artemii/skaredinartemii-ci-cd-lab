name: Pipeline

on:
  push:
    branches: [ main, break-html ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ДЕТЕКТИВ: Показываем, какой файл реально попал на GitHub
      - name: Debug HTML
        if: always()
        run: |
          echo "=== СОДЕРЖИМОЕ INDEX.HTML ==="
          cat index.html
          echo "============================="

      - name: Lint HTML
        if: always()
        run: npx --yes htmlhint index.html

      - name: Build Docker image
        if: always()
        run: |
          # Собираем БЕЗ КЭША, чтобы гарантированно взять новый HTML
          docker build --no-cache -t ghcr.io/skaredin-artemii/skaredinartemii-ci-cd-lab:v1.0 .

      - name: Smoke test container
        if: always()
        run: |
          # Принудительно удаляем локальный образ, чтобы не было путаницы
          docker rmi ghcr.io/skaredin-artemii/skaredinartemii-ci-cd-lab:v1.0 || true
          
          # Запускаем контейнер
          docker run -d --name smoke-test -p 8080:80 ghcr.io/skaredin-artemii/skaredinartemii-ci-cd-lab:v1.0
          sleep 3
          
          # Показываем, что реально отдает сервер
          echo "=== ЧТО ОТДАЕТ СЕРВЕР ==="
          curl -s http://localhost:8080
          echo -e "\n========================"
          
          # Если слова "Скаредин" нет - падаем с кодом 1
          curl -sf http://localhost:8080 | grep -q "Скаредин" || exit 1
          echo "OK"

  release:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/skaredin-artemii/skaredinartemii-ci-cd-lab:latest
            ghcr.io/skaredin-artemii/skaredinartemii-ci-cd-lab:v1.0