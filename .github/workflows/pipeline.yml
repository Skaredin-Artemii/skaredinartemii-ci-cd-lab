name: Pipeline

on:
  push:
    branches: [ main, break-html ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: npx --yes htmlhint index.html

      - if: always()
        run: docker build --no-cache -t ghcr.io/skaredin-artemii/skaredinartemii-ci-cd-lab:v1.0 .

      - if: always()
        run: |
          docker run -d --name smoke-test -p 8080:80 ghcr.io/skaredin-artemii/skaredinartemii-ci-cd-lab:v1.0
          sleep 3
          curl -sf http://localhost:8080 | grep -q "Скаредин" || exit 1
          echo "OK"

  release:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/skaredin-artemii/skaredinartemii-ci-cd-lab:latest
            ghcr.io/skaredin-artemii/skaredinartemii-ci-cd-lab:v1.0